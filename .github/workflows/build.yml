name: Build Debian rootfs

on:
  push:
    paths-ignore:
      - 'bundles/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version
        required: true
        default: v0.3.0
      profile:
        description: Rootfs profile
        type: choice
        options: [base, wine]
        default: base
      publish:
        description: Publish a release and update the pinned bundle after validation
        type: boolean
        default: true
      graphics:
        description: Include the revision-pinned Scarlet Linux graphics producer
        type: boolean
        default: true
      games:
        description: Selected game dependency manifests (none or comma-separated names)
        required: true
        default: none

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          for script in producer/tools/*.sh producer/tests/*.sh; do
            bash -n "$script"
          done
          for script in producer/wrappers/*; do
            sh -n "$script"
          done
          python3 -m py_compile producer/tools/*.py producer/tests/mozc_conversion.py
          python3 -m json.tool producer/graphics.lock.json >/dev/null
          python3 -m json.tool producer/games.lock.json >/dev/null

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build rootfs and corresponding sources
        env:
          ARCH: aarch64
          PROFILE: ${{ inputs.profile || 'base' }}
          VERSION: ${{ inputs.version || format('v0.3.{0}', github.run_number) }}
          GRAPHICS: ${{ (github.event_name != 'workflow_dispatch' || inputs.graphics) && 'enabled' || 'disabled' }}
          GAMES: ${{ inputs.games || 'openttd' }}
        run: bash producer/tools/build_rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ inputs.profile || 'base' }}-aarch64
          path: producer/artifacts/
          if-no-files-found: error
          compression-level: 0
      - name: Check archive, licenses and Linux execution
        env:
          VERSION: ${{ inputs.version || format('v0.3.{0}', github.run_number) }}
          PROFILE: ${{ inputs.profile || 'base' }}
        run: bash producer/tests/check_artifact.sh "producer/artifacts/rootfs-aarch64-${PROFILE}-${VERSION}.tar.zst"

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: debian-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debian-${{ inputs.profile || 'base' }}-aarch64
          path: producer/artifacts
      - name: Publish binary and source archives together, and pin the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || format('v0.3.{0}', github.run_number) }}
          BUILD_REVISION: ${{ github.sha }}
          PROFILE: ${{ inputs.profile || 'base' }}
        run: bash producer/tools/publish_release.sh
